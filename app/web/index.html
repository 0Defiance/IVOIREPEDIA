<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    Le JavaScript critique part le plus tôt possible : le navigateur découvre
    ces fichiers dès la lecture de l'en-tête, sans attendre le bas de page.
    Chemins relatifs, comme la balise du chargeur plus bas : ils suivent la
    même base, quel que soit le préfixe de déploiement. Pas de preconnect
    vers l'API : elle est servie par la même origine (/api/v1), la connexion
    est donc déjà ouverte et un preconnect serait sans effet.
  -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!--
    Les trois graisses d'Inter partent en même temps que le JavaScript, au lieu
    d'attendre que Flutter les réclame une fois le moteur démarré : sur une
    première visite à cache vide, cette mise en série coûtait plusieurs
    secondes. Elles sont servies précompressées en brotli (`Inter-*.ttf.br`,
    voir `tools/precompress_web.py`) et restent un jour en cache. `as="fetch"`
    correspond à la requête XHR que fait le moteur pour charger une police.
  -->
  <link rel="preload" href="assets/assets/fonts/Inter-400.ttf" as="fetch" crossorigin="anonymous" fetchpriority="high">
  <link rel="preload" href="assets/assets/fonts/Inter-600.ttf" as="fetch" crossorigin="anonymous" fetchpriority="high">
  <link rel="preload" href="assets/assets/fonts/Inter-700.ttf" as="fetch" crossorigin="anonymous" fetchpriority="high">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ivoirepedia, l’encyclopédie libre de la Côte d’Ivoire : territoires, histoire, langues, institutions, cultures et patrimoine, dans des articles sourcés.">
  <meta name="theme-color" content="#FBF9F4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ivoirepedia">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">

  <!--
    Onglet : l'emblème éléphant. Trois formats, car chaque navigateur choisit
    le sien : l'ICO est demandé d'office par les navigateurs de bureau et les
    anciens moteurs, le PNG 32 px est le plus net sur les onglets modernes, le
    192 px sert aux écrans denses et aux favoris. Les chemins sont absolus pour
    rester valables depuis une adresse profonde (/articles/…).
  -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/Icon-192.png?v=2">

  <title>Ivoirepedia, l’encyclopédie libre de la Côte d’Ivoire</title>
  <link rel="manifest" href="/manifest.json">

  <!--
    Couverture de lancement. Flutter charge son moteur (plusieurs centaines de
    ko, puis CanvasKit) avant de peindre quoi que ce soit : cette signature
    tient l’écran pendant ce temps. L’application reprend la même marque
    (assets/images/logo.webp) puis retire la couverture en fondu.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FBF9F4;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 24px;
      box-sizing: border-box;
      /* Le pagne documenté, réduit à deux trames très pâles. */
      background-color: #FBF9F4;
      background-image:
        repeating-linear-gradient(90deg, rgba(14, 123, 69, 0.045) 0 1px, transparent 1px 104px),
        repeating-linear-gradient(0deg, rgba(180, 85, 44, 0.035) 0 1px, transparent 1px 132px);
      overflow: hidden;
      transition: opacity 260ms ease;
    }

    #loading img {
      display: block;
      width: min(84vw, 560px);
      height: auto;
    }

    /* Filet de chargement : orange → or → vert, qui balaie le bas. */
    #loading .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 38%;
      background: linear-gradient(90deg, #F07C00, #E7B34A, #0E7B45);
      animation: sweep 1.5s ease-in-out infinite;
    }

    /* Étapes : ce qui se passe vraiment, piloté par des événements réels. */
    #loading .steps {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      margin: 18px 0 0;
      padding: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      color: #8A8478;
    }

    #loading .steps li {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    #loading .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #D8D2C4;
      flex: none;
    }

    #loading li.on {
      color: #0A5C34;
      font-weight: 600;
    }

    #loading li.on .dot {
      background: #0E7B45;
      animation: pulse 1.2s ease-in-out infinite;
    }

    #loading li.done {
      color: #0A5C34;
    }

    #loading li.done .dot {
      background: #0E7B45;
    }

    @keyframes pulse {
      50% { transform: scale(1.5); opacity: 0.6; }
    }

    /* Phrase d'étape, lue par les lecteurs d'écran. */
    #loading .status {
      margin: 10px 0 0;
      max-width: 420px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      color: #4A463F;
      min-height: 1.6em;
    }

    /* Panneau révélé seulement si le moteur tarde : compteur réel + action. */
    #loading .actions {
      margin-top: 12px;
      text-align: center;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      color: #4A463F;
      background: rgba(251, 249, 244, 0.94);
      border: 1px solid #E4DED1;
      border-radius: 10px;
      padding: 10px 16px;
      max-width: 380px;
    }

    #loading .actions[hidden] {
      display: none;
    }

    #loading .actions p {
      margin: 0 0 10px;
      line-height: 1.6;
    }

    #loading button {
      background: #0E7B45;
      color: #FFFFFF;
      border: 0;
      border-radius: 999px;
      padding: 9px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #loading button:hover {
      background: #0A5C34;
    }

    /* Le moteur a peint sa première image : le voile se retire. */
    #loading.gone {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .progress,
      #loading li.on .dot {
        animation: none;
      }
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <!-- WebP d'abord (26 ko), PNG en repli : la marque s'affiche tout de suite. -->
    <picture>
      <source srcset="logo.webp" type="image/webp">
      <img src="logo.png" width="1200" height="298"
           alt="Ivoirepedia, l’encyclopédie libre de la Côte d’Ivoire">
    </picture>
    <div class="progress"></div>
    <ol class="steps" aria-hidden="true">
      <li class="on" data-step="connect"><span class="dot"></span>Connexion</li>
      <li data-step="engine"><span class="dot"></span>Moteur de lecture</li>
      <li data-step="ready"><span class="dot"></span>Encyclopédie</li>
    </ol>
    <p class="status" id="status" role="status">Connexion à l’encyclopédie…</p>
    <div class="actions" id="actions" hidden>
      <p id="slow">Toujours en chargement… <span id="elapsed">10</span> s écoulées.</p>
      <button id="retry" type="button">Recharger la page</button>
    </div>
  </div>

  <!-- Le script de la couverture vit dans loading.js : la CSP bloquante
       interdit les scripts en ligne (docs/SECURITE.md). -->
  <script src="loading.js" defer></script>

  
</body>
</html>
